name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Publish installer and update metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'Warteliste-Viewer-Setup-*.exe' | Select-Object -First 1
          $blockmap = Get-ChildItem dist -Filter 'Warteliste-Viewer-Setup-*.exe.blockmap' | Select-Object -First 1
          $metadata = Get-Item 'dist\latest.yml' -ErrorAction Stop

          if (-not $installer -or -not $blockmap) {
            throw 'The Windows installer or its blockmap was not produced.'
          }

          gh release create "$env:GITHUB_REF_NAME" `
            $installer.FullName $blockmap.FullName $metadata.FullName `
            --verify-tag `
            --title "Warteliste Viewer $env:GITHUB_REF_NAME" `
            --generate-notes

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
